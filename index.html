<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Mafia AI / Diamond Heist</title>
    <!-- Подключение API нейросети Puter -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 1200px;
            height: 800px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            background-color: #222;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            display: flex;
            gap: 15px;
        }

        .ui-box {
            background: rgba(20, 20, 30, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            backdrop-filter: blur(5px);
        }

        #meeting-screen,
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #chat-container {
            width: 70%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #chat-box {
            height: 400px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            border-radius: 10px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 16px;
        }

        .chat-msg {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            animation: fadeIn 0.3s;
        }

        .chat-msg b {
            text-shadow: 1px 1px 0 #000;
        }

        #voting-area {
            display: none;
            width: 70%;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .vote-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: #333;
            color: white;
            border: 3px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .vote-btn:hover {
            transform: scale(1.05);
        }

        .vote-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .vote-btn.skip {
            border-color: #888;
            background: #555;
        }

        .title-text {
            font-size: 40px;
            color: #ff3333;
            text-shadow: 0 0 10px red;
            margin-bottom: 20px;
            font-weight: 900;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #loading-ai {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>

        <div id="ui-layer">
            <div class="ui-box" id="role-text">Роль: ...</div>
            <div class="ui-box" id="score-text">Алмазов: 0 / 10</div>
            <div class="ui-box">WASD - Ходить | E - Взять/Положить | Q - Убить (Мафия)</div>
        </div>

        <div id="meeting-screen">
            <div class="title-text" id="meeting-title">СОБРАНИЕ!</div>
            <div id="chat-container">
                <div id="chat-box"></div>
                <div id="loading-ai">ИИ думает над ответом...</div>
            </div>
            <div id="voting-area"></div>
        </div>

        <div id="game-over-screen">
            <div class="title-text" id="game-over-text" style="font-size: 60px;">ПОБЕДА</div>
            <button class="vote-btn skip" onclick="location.reload()">Играть снова</button>
        </div>
    </div>

    <script>
        // --- ОФФЛАЙН ФРАЗЫ (На случай блокировки нейросети браузером) ---
        const offlinePhrases = [
            "Где был труп?", "Я просто собирал алмазы.", "Кто-нибудь видел убийцу?", "Это точно не я!",
            "Мне кажется, нас хотят запутать.", "Давайте скипнем?", "Я никого не видел.", "Я был на другой стороне базы.",
            "Зачем вы на меня смотрите?", "Мафия выигрывает, надо думать!", "Слишком мало улик."
        ];

        // --- ИНТЕГРАЦИЯ ИИ (Puter.js API) с защитой от сбоев ---
        async function askAI(promptContext) {
            try {
                const response = await puter.ai.chat(
                    "Ты бот в игре Мафия. Отвечай СТРОГО и ТОЛЬКО в формате JSON, без маркдауна, без лишних слов. " + promptContext,
                    { model: "openai/gpt-5.4-nano" }
                );

                // Безопасное извлечение текста
                let rawText = "";
                if (typeof response === 'string') {
                    rawText = response;
                } else if (response && response.message && typeof response.message.content === 'string') {
                    rawText = response.message.content;
                } else if (response && typeof response.text === 'string') {
                    rawText = response.text;
                } else {
                    rawText = JSON.stringify(response);
                }

                // Очистка от маркдауна и парсинг
                let cleanResponse = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                return JSON.parse(cleanResponse);

            } catch (e) {
                console.warn("Связь с ИИ прервана, включен оффлайн-режим.");
                return null; // В случае ошибки вернет null, и игра использует fallback логику
            }
        }

        // --- НАСТРОЙКИ ДВИЖКА ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const STATE_PLAYING = 0;
        const STATE_MEETING = 1;
        const STATE_GAMEOVER = 2;
        let gameState = STATE_PLAYING;

        let score = 0; const TARGET_SCORE = 10;
        let mapWalls = [];
        let rooms = {};
        let diamonds = [];
        let players = [];

        const COLORS = ['Красный', 'Синий', 'Зеленый', 'Желтый', 'Фиолетовый'];
        const HEX_COLORS = ['#ff3333', '#3388ff', '#33ff33', '#ffff33', '#aa33ff'];
        const PLAYER_RADIUS = 16;
        const SPEED = 4.5;
        const BOT_SPEED = 3.5;
        const KILL_COOLDOWN = 600; // ~10 секунд (в кадрах)
        const KILL_RADIUS = 50;

        let basket = { x: 570, y: 370, w: 60, h: 60, room: "Центр" };
        const keys = { w: false, a: false, s: false, d: false };

        // --- ГЕНЕРАЦИЯ ТЕКСТУР ---
        const floorPattern = document.createElement('canvas');
        floorPattern.width = 40; floorPattern.height = 40;
        const pCtx = floorPattern.getContext('2d');
        pCtx.fillStyle = '#22252a'; pCtx.fillRect(0, 0, 40, 40);
        pCtx.strokeStyle = '#1a1c20'; pCtx.lineWidth = 2;
        pCtx.strokeRect(0, 0, 40, 40);
        let floorTex;

        // --- КЛАССЫ ИГРЫ ---
        class Wall {
            constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
            draw() {
                let grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                grad.addColorStop(0, '#556'); grad.addColorStop(1, '#223');
                ctx.fillStyle = grad;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                ctx.fillStyle = '#778';
                ctx.fillRect(this.x, this.y, this.w, 5); // Верхняя грань

                ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
            }
        }

        class Diamond {
            constructor(x, y, room) { this.x = x; this.y = y; this.room = room; this.pulse = Math.random() * Math.PI; }
            draw() {
                this.pulse += 0.05;
                let glow = 10 + Math.sin(this.pulse) * 5;

                ctx.shadowBlur = glow; ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#ccffff';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 10);
                ctx.lineTo(this.x + 10, this.y);
                ctx.lineTo(this.x, this.y + 10);
                ctx.lineTo(this.x - 10, this.y);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Player {
            constructor(id, isBot, colorName, hexColor) {
                this.id = id; this.isBot = isBot;
                this.colorName = colorName; this.hexColor = hexColor;

                this.x = 600 + (Math.random() * 100 - 50);
                this.y = 400 + (Math.random() * 100 - 50);
                this.r = PLAYER_RADIUS;

                this.isMafia = false; this.isDead = false; this.hasDiamond = false;
                this.killCooldown = KILL_COOLDOWN;
                this.currentRoom = "Центр";

                this.memory = { lastSeen: {}, bodiesFound: false };

                this.vx = 0; this.vy = 0;
                this.targetX = null; this.targetY = null;
                this.stuckTimer = 0;
            }

            draw() {
                if (this.isDead) {
                    ctx.fillStyle = this.hexColor; ctx.globalAlpha = 0.5;
                    ctx.beginPath(); ctx.arc(this.x, this.y + 10, this.r, 0, Math.PI, true); ctx.fill();
                    ctx.fillStyle = 'darkred'; ctx.fillRect(this.x - 10, this.y + 10, 20, 5);
                    ctx.globalAlpha = 1.0;
                    ctx.fillStyle = 'white'; ctx.fillRect(this.x - 3, this.y + 5, 6, 8); // Кость
                    return;
                }

                ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Тень
                ctx.beginPath(); ctx.ellipse(this.x, this.y + 15, this.r, this.r / 2, 0, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = this.hexColor; // Тело (рюкзачок)
                ctx.fillRect(this.x - this.r - 4, this.y - this.r + 5, 8, this.r * 1.5);

                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = '#99ccff'; // Визор
                ctx.beginPath(); ctx.ellipse(this.x + 5, this.y - 3, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.fillRect(this.x + 8, this.y - 6, 3, 3); // Блик

                if (this.hasDiamond) {
                    ctx.fillStyle = '#00ffff';
                    ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
                    ctx.fillRect(this.x - 5, this.y - 25, 10, 10);
                    ctx.shadowBlur = 0;
                }

                if (!this.isBot) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r + 5, 0, Math.PI * 2); ctx.stroke();
                }
            }

            update() {
                if (this.isDead || gameState !== STATE_PLAYING) return;
                if (this.killCooldown > 0) this.killCooldown--;

                this.currentRoom = getRoomAt(this.x, this.y);
                this.updateMemory();

                let dx = 0, dy = 0;

                if (!this.isBot) {
                    if (keys.w) dy -= SPEED; if (keys.s) dy += SPEED;
                    if (keys.a) dx -= SPEED; if (keys.d) dx += SPEED;
                } else {
                    this.updateAI();
                    dx = this.vx; dy = this.vy;
                }

                let oldX = this.x; let oldY = this.y;

                if (dx !== 0) {
                    this.x += dx;
                    if (this.checkWallCollision()) this.x = oldX;
                }
                if (dy !== 0) {
                    this.y += dy;
                    if (this.checkWallCollision()) this.y = oldY;
                }

                this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
                this.y = Math.max(this.r, Math.min(canvas.height - this.r, this.y));

                // Застревание ботов
                if (this.isBot) {
                    if ((dx !== 0 && this.x === oldX) || (dy !== 0 && this.y === oldY)) this.stuckTimer++;
                    else this.stuckTimer = 0;

                    if (this.stuckTimer > 15) {
                        let targetArea = getRoomCenter(this.currentRoom);
                        this.targetX = targetArea.x + (Math.random() * 60 - 30);
                        this.targetY = targetArea.y + (Math.random() * 60 - 30);
                        this.stuckTimer = 0;
                    }
                }

                // Обнаружение трупов
                for (let p of players) {
                    if (p.isDead && !p.reported) {
                        if (Math.hypot(this.x - p.x, this.y - p.y) < 80 && this.currentRoom === p.currentRoom) {
                            p.reported = true;
                            startMeeting(this, p);
                            return;
                        }
                    }
                }
            }

            updateMemory() {
                for (let p of players) {
                    if (p !== this && !p.isDead && p.currentRoom === this.currentRoom) {
                        this.memory.lastSeen[p.colorName] = this.currentRoom;
                    }
                }
            }

            updateAI() {
                if (this.targetX === null || Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
                    if (this.isMafia) {
                        let closest = null; let minD = 9999;
                        for (let p of players) {
                            if (p === this || p.isDead || p.isMafia) continue;
                            let d = Math.hypot(this.x - p.x, this.y - p.y);
                            if (d < minD) { minD = d; closest = p; }
                        }
                        if (closest && this.killCooldown <= 0) {
                            this.targetX = closest.x; this.targetY = closest.y;
                        } else {
                            let roomNames = Object.keys(rooms);
                            let randRoom = getRoomCenter(roomNames[Math.floor(Math.random() * roomNames.length)]);
                            this.targetX = randRoom.x + (Math.random() * 80 - 40);
                            this.targetY = randRoom.y + (Math.random() * 80 - 40);
                        }
                    } else {
                        if (this.hasDiamond) {
                            this.targetX = basket.x + basket.w / 2;
                            this.targetY = basket.y + basket.h / 2;
                        } else if (diamonds.length > 0) {
                            let d = diamonds[Math.floor(Math.random() * diamonds.length)];
                            this.targetX = d.x; this.targetY = d.y;
                        } else {
                            let roomNames = Object.keys(rooms);
                            let randRoom = getRoomCenter(roomNames[Math.floor(Math.random() * roomNames.length)]);
                            this.targetX = randRoom.x; this.targetY = randRoom.y;
                        }
                    }
                }

                if (this.targetX !== null) {
                    let angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                    this.vx = Math.cos(angle) * BOT_SPEED;
                    this.vy = Math.sin(angle) * BOT_SPEED;
                }

                if (this.isMafia && this.killCooldown <= 0) {
                    for (let p of players) {
                        if (p !== this && !p.isDead && !p.isMafia && Math.hypot(this.x - p.x, this.y - p.y) < KILL_RADIUS) {
                            p.isDead = true; p.hasDiamond = false;
                            this.killCooldown = KILL_COOLDOWN;
                            this.targetX = null;
                            break;
                        }
                    }
                } else if (!this.isMafia) {
                    if (this.hasDiamond && Math.hypot((basket.x + basket.w / 2) - this.x, (basket.y + basket.h / 2) - this.y) < 60) {
                        this.hasDiamond = false; score++;
                        updateScore();
                        this.targetX = null;
                    } else if (!this.hasDiamond) {
                        for (let i = 0; i < diamonds.length; i++) {
                            if (Math.hypot(diamonds[i].x - this.x, diamonds[i].y - this.y) < 30) {
                                this.hasDiamond = true;
                                diamonds.splice(i, 1);
                                this.targetX = null;
                                break;
                            }
                        }
                    }
                }
            }

            checkWallCollision(testX = this.x, testY = this.y) {
                let hitBox = this.r * 0.8;
                for (let w of mapWalls) {
                    if (testX + hitBox > w.x && testX - hitBox < w.x + w.w &&
                        testY + hitBox > w.y && testY - hitBox < w.y + w.h) {
                        return true;
                    }
                }
                return false;
            }
        }

        // --- КАРТА ---
        function initMap() {
            rooms = {
                "Кухня": { x: 50, y: 50, w: 300, h: 300 },
                "Спальня": { x: 50, y: 450, w: 300, h: 300 },
                "Оружейная": { x: 850, y: 50, w: 300, h: 300 },
                "Реактор": { x: 850, y: 450, w: 300, h: 300 },
                "Центр": { x: 400, y: 200, w: 400, h: 400 }
            };

            mapWalls.push(new Wall(0, 0, 1200, 30));
            mapWalls.push(new Wall(0, 770, 1200, 30));
            mapWalls.push(new Wall(0, 0, 30, 800));
            mapWalls.push(new Wall(1170, 0, 30, 800));

            mapWalls.push(new Wall(350, 30, 30, 150)); mapWalls.push(new Wall(350, 280, 30, 70));
            mapWalls.push(new Wall(30, 350, 150, 30)); mapWalls.push(new Wall(280, 350, 100, 30));

            mapWalls.push(new Wall(350, 450, 30, 100)); mapWalls.push(new Wall(350, 650, 30, 120));
            mapWalls.push(new Wall(30, 420, 150, 30)); mapWalls.push(new Wall(280, 420, 100, 30));

            mapWalls.push(new Wall(820, 30, 30, 150)); mapWalls.push(new Wall(820, 280, 30, 70));
            mapWalls.push(new Wall(850, 350, 100, 30)); mapWalls.push(new Wall(1050, 350, 120, 30));

            mapWalls.push(new Wall(820, 450, 30, 100)); mapWalls.push(new Wall(820, 650, 30, 120));
            mapWalls.push(new Wall(850, 420, 100, 30)); mapWalls.push(new Wall(1050, 420, 120, 30));
        }

        function getRoomAt(x, y) {
            for (let name in rooms) {
                let r = rooms[name];
                if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return name;
            }
            return "Коридор";
        }

        function getRoomCenter(name) {
            if (!rooms[name]) return { x: 600, y: 400 };
            let r = rooms[name]; return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
        }

        function spawnDiamonds() {
            if (diamonds.length < 6 && gameState === STATE_PLAYING) {
                let roomNames = Object.keys(rooms).filter(r => r !== "Центр");
                let randRoom = roomNames[Math.floor(Math.random() * roomNames.length)];
                let r = rooms[randRoom];

                let x = r.x + 50 + Math.random() * (r.w - 100);
                let y = r.y + 50 + Math.random() * (r.h - 100);
                diamonds.push(new Diamond(x, y, randRoom));
            }
        }

        let localPlayer;

        function initGame() {
            floorTex = ctx.createPattern(floorPattern, 'repeat');
            initMap();

            let roles = ['MAFIA', 'CITIZEN', 'CITIZEN', 'CITIZEN', 'CITIZEN'];
            roles.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 5; i++) {
                let p = new Player(i, i !== 0, COLORS[i], HEX_COLORS[i]);
                p.isMafia = (roles[i] === 'MAFIA');
                players.push(p);

                if (i === 0) {
                    localPlayer = p;
                    document.getElementById('role-text').innerText = p.isMafia ? 'Роль: МАФИЯ (Убить: Q)' : 'Роль: Мирный';
                    document.getElementById('role-text').style.color = p.isMafia ? '#ff5555' : '#55ff55';
                }
            }

            requestAnimationFrame(gameLoop);
            setInterval(spawnDiamonds, 3000);
        }

        // --- ЛОГИКА СОБРАНИЯ ---
        let chatHistory = [];
        let votes = {};

        async function startMeeting(reporter, deadPlayer) {
            gameState = STATE_MEETING;
            keys.w = keys.a = keys.s = keys.d = false;

            document.getElementById('meeting-screen').style.display = 'flex';
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('voting-area').style.display = 'none';
            document.getElementById('meeting-title').innerText = `СОБРАНИЕ! Нашли: ${deadPlayer.colorName}`;

            chatHistory = [`СИСТЕМА: ${reporter.colorName} нашел труп (${deadPlayer.colorName}) в ${deadPlayer.currentRoom}.`];
            addChatHTML("СИСТЕМА", chatHistory[0], "#aaa");

            let aliveBots = players.filter(p => p.isBot && !p.isDead);

            for (let bot of aliveBots) {
                document.getElementById('loading-ai').style.display = 'block';

                let memoryStr = Object.keys(bot.memory.lastSeen)
                    .map(k => `${k} был в ${bot.memory.lastSeen[k]}`)
                    .join(", ");
                if (!memoryStr) memoryStr = "Никого не видел.";

                let prompt = `
                Твой цвет: ${bot.colorName}. Роль: ${bot.isMafia ? 'Мафия' : 'Мирный'}.
                Ты был в: ${bot.currentRoom}. Твоя память: ${memoryStr}. Чат: ${chatHistory.join(" | ")}.
                Напиши ОДНУ короткую реплику (до 10 слов) для чата на русском.
                Формат JSON: {"msg": "твой текст"}
            `;

                let response = await askAI(prompt);

                // Если ИИ сломался - берем заготовленную фразу (Fallback)
                let msgText = offlinePhrases[Math.floor(Math.random() * offlinePhrases.length)];
                if (response && response.msg) {
                    msgText = response.msg;
                }

                chatHistory.push(`${bot.colorName}: ${msgText}`);
                addChatHTML(bot.colorName, msgText, bot.hexColor);
                await new Promise(r => setTimeout(r, 1000));
            }

            document.getElementById('loading-ai').style.display = 'none';
            startVoting(aliveBots);
        }

        function addChatHTML(name, text, color) {
            let chat = document.getElementById('chat-box');
            let div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b style="color: ${color}">[${name}]:</b> ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function startVoting(aliveBots) {
            addChatHTML("СИСТЕМА", "Голосование началось! Выберите подозреваемого.", "#0f0");
            let voteArea = document.getElementById('voting-area');
            voteArea.innerHTML = ''; voteArea.style.display = 'flex';

            votes = { "Skip": 0 };
            players.forEach(p => { if (!p.isDead) votes[p.colorName] = 0; });

            if (localPlayer.isDead) {
                voteArea.innerHTML = '<div style="color:red; font-size:20px;">Вы мертвы и не голосуете.</div>';
                processBotVotes(aliveBots);
                return;
            }

            players.forEach(p => {
                if (!p.isDead) {
                    let btn = document.createElement('button');
                    btn.className = 'vote-btn'; btn.style.borderColor = p.hexColor;
                    btn.innerText = `Голосовать: ${p.colorName}`;
                    btn.onclick = () => { castVote(p.colorName); processBotVotes(aliveBots); };
                    voteArea.appendChild(btn);
                }
            });

            let skipBtn = document.createElement('button');
            skipBtn.className = 'vote-btn skip'; skipBtn.innerText = 'Пропустить (Skip)';
            skipBtn.onclick = () => { castVote('Skip'); processBotVotes(aliveBots); };
            voteArea.appendChild(skipBtn);
        }

        function castVote(target) {
            document.querySelectorAll('.vote-btn').forEach(b => b.disabled = true);
            addChatHTML("ВЫ", `Проголосовал за: ${target}`, "#fff");
            votes[target]++;
        }

        async function processBotVotes(aliveBots) {
            document.getElementById('loading-ai').style.display = 'block';
            document.getElementById('loading-ai').innerText = "ИИ анализирует чат для голосования...";

            for (let bot of aliveBots) {
                let aliveNames = players.filter(p => !p.isDead).map(p => p.colorName).join(", ");
                let prompt = `
                Твой цвет: ${bot.colorName}. Живые: ${aliveNames}. Чат: ${chatHistory.join(" | ")}.
                Кого выкинуть? Выбери одно имя из Живых или напиши "Skip".
                Формат JSON: {"vote": "Имя или Skip"}
            `;

                let response = await askAI(prompt);

                // Если ИИ сломался - боты голосуют случайно (Fallback)
                let target = "Skip";
                let keys = Object.keys(votes);
                if (response && response.vote && (votes[response.vote] !== undefined)) {
                    target = response.vote;
                } else {
                    target = keys[Math.floor(Math.random() * keys.length)];
                }

                votes[target]++;
                addChatHTML("СИСТЕМА", `${bot.colorName} проголосовал.`, "#666");
            }

            document.getElementById('loading-ai').style.display = 'none';
            setTimeout(tallyVotes, 1500);
        }

        function tallyVotes() {
            let max = -1; let ejected = null; let tie = false;
            for (let k in votes) {
                if (votes[k] > max) { max = votes[k]; ejected = k; tie = false; }
                else if (votes[k] === max) tie = true;
            }

            let res = "";
            if (tie || ejected === 'Skip') res = "Ничья или пропуск. Никто не выбывает.";
            else {
                let p = players.find(x => x.colorName === ejected);
                if (p) {
                    p.isDead = true;
                    res = `${ejected} был выкинут. Он был ${p.isMafia ? 'МАФИЕЙ!' : 'Мирным.'}`;
                }
            }
            addChatHTML("ИТОГ", res, "#ff0");

            setTimeout(() => {
                document.getElementById('meeting-screen').style.display = 'none';
                checkWinCondition();
                if (gameState !== STATE_GAMEOVER) resetAfterMeeting();
            }, 4000);
        }

        function checkWinCondition() {
            let aliveMafia = players.filter(p => p.isMafia && !p.isDead).length;
            let aliveCit = players.filter(p => !p.isMafia && !p.isDead).length;

            if (score >= TARGET_SCORE) return endGame("МИРНЫЕ ПОБЕДИЛИ! Алмазы собраны.");
            if (aliveMafia === 0) return endGame("МИРНЫЕ ПОБЕДИЛИ! Мафия мертва.");
            if (aliveMafia >= aliveCit) return endGame("МАФИЯ ПОБЕДИЛА! Убиты все.");
        }

        function endGame(txt) {
            gameState = STATE_GAMEOVER;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('game-over-text').innerText = txt;
        }

        function resetAfterMeeting() {
            gameState = STATE_PLAYING;
            players.forEach(p => {
                if (!p.isDead) {
                    let center = getRoomCenter("Центр");
                    p.x = center.x + (Math.random() * 60 - 30);
                    p.y = center.y + (Math.random() * 60 - 30);
                    p.reported = false; p.targetX = null;
                    p.memory = { lastSeen: {}, bodiesFound: false };
                    if (p.isMafia) p.killCooldown = KILL_COOLDOWN;
                }
            });
        }

        function updateScore() {
            document.getElementById('score-text').innerText = `Алмазов: ${score} / ${TARGET_SCORE}`;
            if (score >= TARGET_SCORE) checkWinCondition();
        }

        // --- УПРАВЛЕНИЕ ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;

            if (gameState !== STATE_PLAYING || localPlayer.isDead) return;

            if (e.code === 'KeyE' && !localPlayer.isMafia) {
                if (localPlayer.hasDiamond) {
                    if (Math.hypot((basket.x + 30) - localPlayer.x, (basket.y + 30) - localPlayer.y) < 60) {
                        localPlayer.hasDiamond = false; score++; updateScore();
                    }
                } else {
                    for (let i = 0; i < diamonds.length; i++) {
                        if (Math.hypot(diamonds[i].x - localPlayer.x, diamonds[i].y - localPlayer.y) < 40) {
                            localPlayer.hasDiamond = true; diamonds.splice(i, 1); break;
                        }
                    }
                }
            }

            if (e.code === 'KeyQ' && localPlayer.isMafia && localPlayer.killCooldown <= 0) {
                for (let p of players) {
                    if (!p.isDead && !p.isMafia && p !== localPlayer && Math.hypot(p.x - localPlayer.x, p.y - localPlayer.y) < KILL_RADIUS) {
                        p.isDead = true; p.hasDiamond = false; localPlayer.killCooldown = KILL_COOLDOWN; break;
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
        });

        // --- РЕНДЕР ЦИКЛ ---
        function gameLoop() {
            if (gameState === STATE_PLAYING) {
                ctx.fillStyle = floorTex;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                for (let name in rooms) {
                    ctx.fillText(name, rooms[name].x + rooms[name].w / 2, rooms[name].y + rooms[name].h / 2);
                }

                ctx.fillStyle = 'rgba(255, 100, 0, 0.3)';
                ctx.beginPath(); ctx.arc(basket.x + 30, basket.y + 30, 45, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#8B4513'; ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
                ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.fillText('КОРЗИНА', basket.x + 30, basket.y + 35);

                mapWalls.forEach(w => w.draw());
                diamonds.forEach(d => d.draw());

                players.forEach(p => p.update());

                let drawOrder = [...players].sort((a, b) => (a.isDead === b.isDead) ? 0 : a.isDead ? -1 : 1);
                drawOrder.forEach(p => p.draw());

                if (localPlayer.isMafia && !localPlayer.isDead) {
                    ctx.fillStyle = 'white'; ctx.font = '16px Arial';
                    let cd = Math.ceil(localPlayer.killCooldown / 60);
                    ctx.fillText(cd > 0 ? `КД: ${cd}с` : 'УБИТЬ (Q)', localPlayer.x, localPlayer.y - 25);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        window.onload = initGame;
    </script>
